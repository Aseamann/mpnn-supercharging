# Benchmark parameters. Cluster paths live in cluster.yaml, not here.
#
# The resolved_targets block at the bottom of this file is generated by
# 00_curate_scaffolds.py and must not be hand-edited. Everything above it is
# hand-written and frozen before any run starts.

# ---------------------------------------------------------------------------
# Phase 1: scaffold curation
# ---------------------------------------------------------------------------

scaffold_source:
  # PLAN.md Section 4 filter 1: the CATH 4.2 based test split used by the
  # ProteinMPNN paper. Decision C, resolved 2026-08-13: this split is the
  # candidate pool AND soluble_model_weights/excluded_PDBs.csv is applied on
  # top of it, because mpnn_soluble is the primary arm.
  #
  # The split is not distributed inside the ProteinMPNN clone. It is fetched
  # once to data/splits/ and its sha256 is recorded in results/environment.json.
  # 00_curate_scaffolds.py verifies the downloaded JSON exposes a "test" key
  # and stops if it does not; it never falls back to a substitute list.
  split_url: http://people.csail.mit.edu/ingraham/graph-protein-design/data/cath/chain_set_splits.json
  split_file: data/splits/chain_set_splits.json
  split_key: test
  split_name: cath4.2_test
  # Relative to cluster.yaml paths.proteinmpnn.
  excluded_pdbs: soluble_model_weights/excluded_PDBs.csv

filters:
  # PLAN.md Section 4 filters 2 to 5.
  experimental_method: X-RAY DIFFRACTION
  max_resolution: 2.5
  min_residues: 80
  max_residues: 250
  max_chain_break: 2          # residues; longer gaps disqualify
  # Resolved 2026-08-13. False means the requirement is that the DESIGNED chain
  # is a single protein chain, not that the asymmetric unit holds exactly one.
  # Other chains, ligands and waters are stripped. The strict reading rejected
  # 459 candidates of which 285 pass every other filter, and it fell hardest on
  # beta-rich folds, which are disproportionately oligomeric in the ASU, leaving
  # mainly_beta with only 6 members. Trade-off accepted: some retained chains
  # come from obligate oligomers, so part of their apparent surface is really a
  # buried interface. n_chains_in_asu is recorded in data/filtered.csv so the
  # affected scaffolds remain identifiable.
  require_single_chain_asu: false
  strip_heteroatoms: true     # ligands and waters removed
  # Disqualifying if present and contacting the fold; see 00_curate_scaffolds.py.
  reject_nucleic_acids: true
  mmseqs:
    min_seq_id: 0.3
    coverage: 0.8

fold_classes:
  # Decision F, resolved 2026-08-13. The Section 4 cutoffs are neither
  # exhaustive nor mutually exclusive on their own, so a precedence order and a
  # discard rule are frozen here. First match in `precedence` wins. A scaffold
  # matching no class is discarded and logged; it is never forced into a class.
  # Resolved 2026-08-13: loop_rich is NOT in the precedence list and is not a
  # class in this benchmark. Every one of the 9 scaffolds satisfying coil >= 0.50
  # also satisfied alpha_beta, which precedes it, so it could never receive a
  # member. Rather than reorder the frozen precedence, the class is dropped and
  # the benchmark runs 3 fold classes. Its definition is kept below only so the
  # discard reasons stay readable. PLAN.md Section 4 acceptance was amended to
  # match.
  precedence: [mainly_alpha, mainly_beta, alpha_beta]
  definitions:
    mainly_alpha:
      min_helix: 0.40
      max_strand: 0.10
    mainly_beta:
      min_strand: 0.30
      max_helix: 0.10
    alpha_beta:
      min_helix: 0.15
      min_strand: 0.15
    loop_rich:
      min_coil: 0.50
  # DSSP 8-state to 3-state mapping, frozen. G and I count as helix, B counts
  # as strand. Anything not listed maps to coil.
  dssp_map:
    H: helix
    G: helix
    I: helix
    E: strand
    B: strand
    T: coil
    S: coil
    P: coil
    "-": coil
    " ": coil

selection:
  n_per_class: 8
  # Sample across the length range and across WT net charge within each class.
  min_positive_q_wt_per_class: 2
  # eGFP is added outside the split as scaffold 33 so manuscript Table 1 stays
  # anchored to the benchmark.
  focus_scaffold:
    scaffold_id: eGFP
    chain: A
    source_split: focus_egfp

# ---------------------------------------------------------------------------
# Phase 2: charge ladder and design matrix
# ---------------------------------------------------------------------------

charge_ladder:
  # Units: charge per 100 residues. Absolute targets are meaningless across a
  # 4-fold length range, so targets are size-normalized:
  #   delta_q       = round(delta_q_density * n_residues / 100)
  #   target_charge = q_wt + delta_q          # this is what -c expects
  delta_q_density: [-24, -16, -8, -4, 4, 8, 16, 24]

charge_definition:
  # lib/charge.py is the single source of truth: (K+R) - (D+E).
  # No histidine, no terminal charges. Matches the repo script with -addhis
  # absent, which is how every arm of this benchmark runs.
  add_histidine: false

design:
  n_samples: 10
  temperature: 0.3
  model: v_48_020
  # Decision E, resolved 2026-08-13: Phase 2 is a single -u run, not two.
  # F11's per-scaffold ceiling is redefined as the maximum |delta_q_density|
  # over cells that hit their target with final_temperature == 0.3, and the F11
  # heatmap uses final_temperature from the same run.
  unrestrict: true
  probability_threshold: 0.01
  mutate_glyprocys: false
  no_fastrelax: false

arms:
  # hbond_filter is the frozen column convention and reads backwards from the
  # flag name: hbond_filter=False means -mhbond WAS passed (protection off).
  # lib/io.py derives it in exactly one place. See PLAN.md Section 5.
  #
  # Each arm gets its own working directory because the repo script's
  # LayerSelector cache key (parsed/<pdb>_seq_indices.pkl) does not encode
  # mutate_hbonded_sidechains, even though parse_for_supercharge is called with
  # it. Sharing one cache across arms would silently reuse the primary arm's
  # designable set for the control arm. See logs/ISSUES.md.
  - name: mpnn_soluble
    weights: soluble
    mutate_hbonded_sidechains: true    # -mhbond passed; primary arm
    workdir: data
    scaffolds: all
    primary: true
  - name: mpnn_vanilla_weights
    weights: original
    mutate_hbonded_sidechains: true    # -mhbond passed
    workdir: data
    scaffolds: all
    primary: false
  - name: mpnn_soluble_hbond_protected
    weights: soluble
    mutate_hbonded_sidechains: false   # flag absent; h-bonded sidechains protected
    workdir: data/hbond_protected
    # eGFP plus 8 scaffolds, 2 per fold class. Resolved by 00_curate_scaffolds.py
    # into the resolved_targets block and written to slurm/tasks_phase2.tsv.
    scaffolds: control_subset
    control_subset_per_class: 2
    primary: false
  # Added 2026-09-05. Biased ProteinMPNN weight sets, run through the same
  # supercharging decoder as the primary arm so the only difference is the
  # checkpoint. HyperMPNN is fine-tuned toward thermostable sequences, HaloMPNN
  # toward halophilic (acidic-surface) ones; whether that helps or hinders
  # charge-directed decoding is a measurement, not an assumption.
  #
  # protein_mpnn_supercharge.py:618-622 builds its checkpoint path as
  # <path_to_weights>/{vanilla,soluble}_model_weights/<model>.pt and has no
  # --checkpoint flag and no else branch, so an unrecognised --weights value
  # raises UnboundLocalError. The repo-root script is NOT modified. Instead
  # weights_root points at a shim directory under Benchmark/ laid out the way
  # the script expects, holding symlinks to the real checkpoint and to the
  # patched protein_mpnn_utils.py (--path_to_weights doubles as the import root
  # at :625-627). weights stays "original" because the shim uses the
  # vanilla_model_weights subdirectory name. See logs/ISSUES.md.
  #
  # Both pass -mhbond and use workdir data, so they share the primary arm's
  # LayerSelector cache and need no Phase 1 rerun.
  #
  # Appended, never inserted: 02_run_mpnn_supercharge.py --emit-tasks numbers
  # task_id in arm order, so appending leaves existing tasks_phase2.tsv indices
  # valid and --array reruns of earlier arms keep working.
  - name: mpnn_hyper
    weights: original
    weights_root: data/altweights/hyper
    mutate_hbonded_sidechains: true    # -mhbond passed, matching the primary arm
    workdir: data
    scaffolds: all
    primary: false
  - name: mpnn_halo
    weights: original
    weights_root: data/altweights/halo
    mutate_hbonded_sidechains: true    # -mhbond passed, matching the primary arm
    workdir: data
    scaffolds: all
    primary: false

seeds:
  # Decision A, resolved 2026-08-13. protein_mpnn_supercharge.py:642 draws its
  # seed from an unseeded RNG in range 0..999, never prints it, and has no
  # --seed flag. scripts/02_run_mpnn_supercharge.py seeds numpy immediately
  # before calling main(), which makes that draw deterministic and knowable.
  # Nothing outside Benchmark/ is modified.
  #
  # The per-cell seed is derived from this base plus a blake2b digest of
  # (scaffold_id, arm, target_charge, sample_index), so the 0..999 collision
  # across 2,640 designs does not matter: the recorded seed is the 64-bit value
  # passed to np.random.seed, not the script's internal draw.
  base_seed: 20260813

baseline_arms:
  # Phase 3, PLAN.md Section 6. Both drive PyRosetta's Supercharge mover using
  # the settings in Former_Methods/eGFP/run_pyrosetta_supercharge.py, which is
  # not modified. Direction is taken from sign(delta_q), not from the sign of
  # the target charge; see scripts/lib/baseline.py for why.
  #
  # nstruct 10 since 2026-08-26, PLAN.md Section 0.1 item 16. It was 1, which
  # made n_unique_mutation_sets 1 by construction and left the "deterministic by
  # construction" claim untestable. The reference runs in
  # Former_Methods/eGFP/TargetPos2_Avn/ produced 65, 65 and 61 mutations across
  # three replicates, pointing the other way. The arm now matches every other
  # sampled arm, so the number is measured. Replicates run in one PyRosetta RNG
  # stream per cell, exactly as the rosetta arm does, so s00 reproduces the
  # nstruct 1 result.
  - name: avnapsa
    avnapsa: true
    nstruct: 10
  # nstruct 10 exists to test the claim that Rosetta is near-deterministic.
  # n_unique_mutation_sets in the sidecar is the number that matters.
  - name: rosetta
    avnapsa: false
    nstruct: 10
  # Added 2026-09-05. The h-bond-protection-off counterpart to the rosetta arm.
  # lib/baseline.py hardcoded dont_mutate_hbonded_sidechains(True), so the
  # rosetta arm PROTECTS h-bonded sidechains while the primary MPNN arm
  # (-mhbond passed) does not. F9 compares them anyway. hbond_protect false
  # makes that comparison matched, and mirrors what -mhbond does on the MPNN
  # side. Run on the same control_subset as mpnn_soluble_hbond_protected so all
  # four series of the on/off comparison sit on identical scaffolds.
  #
  # hbond_protect defaults to true, so the avnapsa and rosetta entries above
  # keep their current behaviour and their task_ids are unchanged.
  - name: rosetta_hbond_off
    avnapsa: false
    nstruct: 10
    hbond_protect: false
    scaffolds: control_subset

# ---------------------------------------------------------------------------
# Phase 4: rejection ablation and negative control
# ---------------------------------------------------------------------------

phase4:
  rejection:
    # Unmodified protein_mpnn_run.py, restricted to the primary arm's designable
    # set via a fixed-positions JSONL derived from data/parsed/*_seq_indices.pkl.
    # Weights and model match mpnn_soluble so the only difference from the
    # primary arm is the absence of the charge-directed decoding.
    name: vanilla_rejection
    n_samples: 2000
    # protein_mpnn_run.py computes NUM_BATCHES by integer division, so this must
    # divide n_samples exactly or the pool silently comes up short. Checked in
    # lib/phase4.emit_tasks.
    batch_size: 20
    temperature: 0.3
    weights: soluble
    model: v_48_020
    out_dir: designs/vanilla_rejection
  random_control:
    # Randomly chosen designable positions mutated to K/R or D/E until the
    # target is reached. Gly, Pro and Cys need no exclusion here: the cached
    # designable set was built with mutate_glyprocys False and already omits
    # them. See lib/phase4.random_charge_design for the three points where
    # PLAN.md Section 7's one-sentence specification needed resolving.
    name: random_control
    n_replicates: 10

